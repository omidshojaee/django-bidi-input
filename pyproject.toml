[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-bidi-input"
version = "1.0.0"
description = "Force correct text direction (LTR/RTL) on Django admin and form input fields, regardless of site language."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Omid Shojaee", email = "omid.shojaee@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["Django>=5.2"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-django>=4"]

[project.urls]
Homepage = "https://github.com/omidshojaee/django-bidi-input"
Issues = "https://github.com/omidshojaee/django-bidi-input/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
pythonpath = ["."]
